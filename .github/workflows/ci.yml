name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install development tools
        run: python -m pip install -e '.[dev]' build
      - name: Test without agent or provider access
        run: python -m pytest -q
      - name: Build source distribution and wheel
        run: python -m build
      - name: Verify distribution contents
        run: python scripts/check_dist.py dist
      - name: Smoke test installed wheel outside checkout
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          smoke_dir=$(mktemp -d)
          cd "$smoke_dir"
          agent-cost-lab --help
          agent-cost-lab demo-report --out demo.md
          test -s demo.md
