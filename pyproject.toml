[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cost-lab"
version = "0.1.0"
description = "Apply coding-agent context optimization and measure its effect with independent verification"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Repository = "https://github.com/dharmendrathinks/agent-cost-lab"
Issues = "https://github.com/dharmendrathinks/agent-cost-lab/issues"
Documentation = "https://github.com/dharmendrathinks/agent-cost-lab/blob/main/README.md"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
agent-cost-lab = "agent_cost_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
default-groups = []
